name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # LiteLLM otherwise downloads its price table when it is first imported.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            frontend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Evaluation gate (offline, BM25, no LLM)
        env:
          PYTHONPATH: backend
          RETRIEVAL_MODE: bm25
          LLM_ENABLED: "off"
        run: python -m app.eval.run_eval
      - name: Keep the evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: evals/reports/bm25.*

  # Builds the two images and starts the full stack (API, front, PostgreSQL, Qdrant),
  # then asks it a documentary question and opens a ticket. The first start downloads
  # the embedding model, about 220 MB.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker compose build
      - name: Start
        run: docker compose up -d
      - name: Wait for the API (the first start downloads the embedding model)
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 5
          done
          exit 1
      # The front starts once the API is healthy, and takes a few seconds of its own.
      - name: Wait for the front
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Smoke test
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/ask \
            -H "Content-Type: application/json" \
            -d '{"q": "Quelle est la majoration pour un déplacement le week-end ?"}' \
            -o response.json
          python -c "import json; r = json.load(open('response.json')); assert r['route'] == 'rag' and r['citations'] and r['retrieval_mode'] == 'hybrid', r"
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/ask \
            -H "Content-Type: application/json" \
            -d '{"q": "Je conteste la facture de 120 €, le montant ne correspond pas au devis.", "client_id": "C-12"}' \
            -o dispute.json
          python -c "import json; r = json.load(open('dispute.json')); assert r['route'] == 'automation' and r['ticket_id'], r"
          curl -fsS http://127.0.0.1:8000/api/v1/tickets -o tickets.json
          python -c "import json; t = json.load(open('tickets.json')); assert [x['kind'] for x in t] == ['litige_standard'], t"
          curl -fsS http://127.0.0.1:8501/_stcore/health
      # The last lines of each service also go out as annotations: unlike the log of
      # the job, they can be read on the page of the run without signing in.
      - name: Logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 80
          for service in api frontend db qdrant; do
            lines=$(docker compose logs --no-color --no-log-prefix --tail 12 "$service" 2>&1 | cut -c1-220 | sed 's/%/%25/g' | sed -z 's/\r//g; s/\n/%0A/g')
            echo "::error title=$service::$lines"
          done
      - name: Stop
        if: always()
        run: docker compose down -v
