name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # LiteLLM otherwise downloads its price table when it is first imported.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            frontend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Evaluation gate (offline, BM25, no LLM)
        env:
          PYTHONPATH: backend
          RETRIEVAL_MODE: bm25
          LLM_ENABLED: "off"
        run: python -m app.eval.run_eval
      - name: Keep the evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: evals/reports/latest.*

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker compose build
      - name: Start
        run: docker compose up -d
      - name: Wait for the API (the first start downloads the embedding model)
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Smoke test
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/ask \
            -H "Content-Type: application/json" \
            -d '{"q": "Quelle est la majoration pour un déplacement le week-end ?"}' \
            -o response.json
          python -c "import json; r = json.load(open('response.json')); assert r['route'] == 'rag' and r['citations'], r"
          curl -fsS http://127.0.0.1:8501/_stcore/health
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
