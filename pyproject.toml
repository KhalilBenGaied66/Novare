[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["_private", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "S"]
ignore = [
    "S101",  # assert is the point of tests
    "B008",  # FastAPI `Depends()` in signatures
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S105", "S106", "S311"]
"frontend/tests/*" = ["S105", "S106"]
"scripts/*" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "frontend/tests"]
pythonpath = ["backend", "frontend"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
